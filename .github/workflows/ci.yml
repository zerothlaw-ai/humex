name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # humex is a uv monorepo: the root pyproject.toml is the workspace
          # config (no [project]); the core package lives in ./humex.
          pip install -e "./humex[test]"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check humex/src/humex humex/tests
        continue-on-error: true

      - name: Run tests
        run: pytest humex/tests/ -v
