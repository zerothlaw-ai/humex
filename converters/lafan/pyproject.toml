[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humex-converter-lafan"
version = "0.2.0"
description = "LAFAN1 (Unitree H1) converter plugin for humex"
authors = [{name = "humex contributors", email = "humex@zerothlaw.io"}]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["humex", "lafan", "unitree", "h1", "robotics", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "humex>=0.2,<0.3",
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.entry-points."humex.converters"]
lafan = "humex_converter_lafan:LafanConverter"

[project.urls]
Homepage = "https://github.com/zerothlaw-ai/humex"
Source = "https://github.com/zerothlaw-ai/humex/tree/main/converters/lafan"
Issues = "https://github.com/zerothlaw-ai/humex/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"humex_converter_lafan" = ["assets/**/*"]
